[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "beamlink"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["beamlink"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "NPY"]

[tool.ruff.lint.isort]
known-first-party = ["beamlink"]

[tool.pytest.ini_options]
testpaths = ["tests"]
